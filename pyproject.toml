[project]
name = "copa-ai"
version = "1.0.0"
description = "Backend Flask + Groq para chatbot especialista em Copa do Mundo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=6,<7",
    "groq>=0.30,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
